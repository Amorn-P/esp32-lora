; PlatformIO Project Configuration File
; CherryOne ModbusHealth — Commercial Production v2.0
;
; https://docs.platformio.org/page/projectconf.html

[env:esp32doit-devkit-v1]
platform = espressif32@3.5.0
board = esp32doit-devkit-v1
framework = arduino
lib_extra_dirs = C:\Users\SKY\Documents\PlatformIO\Projects\libraries
monitor_speed = 115200

; ===========================================================================
; PRODUCTION BUILD FLAGS (conservative for Core 1.0.6 compatibility)
; ===========================================================================
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DCONFIG_ARDUINO_LOOP_STACK_SIZE=8192
    -DPRODUCTION_BUILD=1
    -DCONFIG_ESP32_BROWNOUT_DET=1
