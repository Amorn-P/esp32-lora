; ESP32_Lora - 1 Master (AA) + 7 Slaves (B1-B7)
; PlatformIO Project Configuration

[common]
platform = espressif32@3.5.0
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
lib_extra_dirs = C:\Users\SKY\Documents\PlatformIO\Projects\libraries

; ============================================================
; ENV: Master (AA) - Board ID 0
; CommCore (WiFi/Blynk/Telegram/OTA) + LoRa Gateway
; ============================================================
[env:master]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
lib_extra_dirs = ${common.lib_extra_dirs}
build_flags = 
    -D BOARD_TYPE=0
    -D CORE_DEBUG_LEVEL=1
lib_deps = 
    jgromes/RadioLib@^6.0.0
    adafruit/RTClib@^2.1.1
    marcoschwartz/LiquidCrystal_I2C@^1.1.4
    # INA226 not on Master (only B2/B3 slaves have solar sensor)

; ============================================================
; ENV: Slave (B1-B7) - Board ID 1-7
; LoRa + RTC + Relays only. NO WiFi/Blynk/CommCore.
; ============================================================
[env:slave]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
lib_extra_dirs = ${common.lib_extra_dirs}
build_flags = 
    -D BOARD_TYPE=1
    -D CORE_DEBUG_LEVEL=1
lib_ignore = 
    CommCore
    Blynk
    IotWebConf
    Universal-Arduino-Telegram-Bot
lib_deps = 
    jgromes/RadioLib@^6.0.0
    adafruit/RTClib@^2.1.1
    robtillaart/INA226@^0.5.4
    paulstoffregen/OneWire@^2.3.7
    milesburton/DallasTemperature@^3.11.0
